name: ci

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          version: "0.11.28"
      - run: uv sync --frozen --group dev
      - run: uv run --frozen ruff check --config pyproject.toml .
      - run: uv run --frozen ruff format --config pyproject.toml --check .
      - run: uv run --frozen python -m pytest

  frontend:
    name: Frontend (lint + types + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: medix
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: medix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medix"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AUTH_SECRET: ci-build-and-test-only-not-a-production-secret
      ASU_RC_API_KEY: ci-build-only-no-inference
      POSTGRES_URL: postgresql://medix:ci-only@127.0.0.1:5432/medix
      MEDIX_API_URL: http://127.0.0.1:5001
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome check .
      - run: pnpm typecheck
      - run: pnpm test:unit
      - name: Production dependency security gate
        run: pnpm audit --prod --audit-level high
      - name: Validate database migrations
        run: pnpm db:migrate
      - name: Production build
        run: pnpm build

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev
      - name: File, secret and syntax checks
        run: SKIP=ruff-check,ruff-format,biome-check,tsc-noemit uv run --frozen pre-commit run --all-files

  container:
    name: Backend production image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --file backend/Dockerfile --tag medix-backend:ci .
      - name: Import the application without downloading inference weights
        run: >-
          docker run --rm --entrypoint uv medix-backend:ci run --no-sync python -c
          'from backend.application import create_app; from backend.config import AppSettings;
          from backend.container import ServiceContainer;
          s = AppSettings.safe_defaults();
          app = create_app(settings=s, services=ServiceContainer.unavailable(s, "ci"));
          assert app.title == "Medix Medical Procedure QA API"'
