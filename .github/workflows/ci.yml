name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (uv quality gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install locked Python dependencies
        run: uv sync --frozen --group dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Backend tests with coverage
        run: uv run pytest -q --cov=backend

  frontend:
    name: Frontend (Biome + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm exec biome check .

      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit

      - name: Frontend unit tests
        run: pnpm test:unit

      - name: Next.js production build
        env:
          AUTH_SECRET: ci-auth-secret-for-build-only
          GROQ_API_KEY: ci-groq-key-for-build-only
          POSTGRES_URL: postgresql://ci:ci@localhost:5432/ci
          MEDIX_API_URL: http://localhost:8080
        run: pnpm build

  pre-commit:
    name: pre-commit (all hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend deps (needed for local Biome hook)
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install locked Python dependencies
        run: uv sync --frozen --group dev

      - name: Run all pre-commit hooks
        run: uv run pre-commit run --all-files
