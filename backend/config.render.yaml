# Render container profile; evidence and secrets come from runtime configuration.
web:
  host: 0.0.0.0
  port: 10000
  debug: false
  max_content_length: 10485760
database:
  embedding_model: all-MiniLM-L6-v2
  top_k: 5
  similarity_threshold: 0.25
  lexical_weight: 0.15
ai:
  provider: voyager
  voyager:
    model: qwen35-27b
    temperature: 0
    max_tokens: 2048
  ollama:
    base_url: http://localhost:11434
    model: qwen3.5:9b-q4_K_M
    temperature: 0
    max_tokens: 512
vision:
  model: qwen35-27b
  max_image_size: 10485760
  top_k_matches: 5
research_pipeline:
  enabled: true
  top_k: 5
  retrieval_weight: 0.0
  lexical_weight: 0.15
  transcript_weight: 0.5
  window_seconds: 90
  stride_seconds: 45
  frames_per_window: 3
  frames_per_bundle: 3
  answer_model: structured_voyager
  localizer_strategy: multimodal_window
  supported_collection_only: true
  ccal_cycle_weight: 0.25
safety:
  answer_confidence_threshold: 0.35
