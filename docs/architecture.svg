<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#14b8a6"/>
      <stop offset="100%" style="stop-color:#0d9488"/>
    </linearGradient>
    <linearGradient id="slate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#334155"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="880" height="700" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="440" y="38" text-anchor="middle" fill="#f1f5f9" font-size="19" font-weight="700">MedVidQA — Multimodal RAG Pipeline</text>
  <text x="440" y="56" text-anchor="middle" fill="#64748b" font-size="11">How a question becomes a video-guided answer</text>

  <!-- ===== ROW 1: INPUTS (y=80) ===== -->
  <rect x="40"  y="80" width="180" height="64" rx="10" fill="url(#blue)" filter="url(#sh)"/>
  <text x="130" y="106" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">⌨️  Text Query</text>
  <text x="130" y="122" text-anchor="middle" fill="#bfdbfe" font-size="10">Type your question</text>

  <rect x="240" y="80" width="180" height="64" rx="10" fill="url(#blue)" filter="url(#sh)"/>
  <text x="330" y="106" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">🎙️  Voice Input</text>
  <text x="330" y="122" text-anchor="middle" fill="#bfdbfe" font-size="10">Speak your question</text>

  <rect x="460" y="80" width="180" height="64" rx="10" fill="url(#blue)" filter="url(#sh)"/>
  <text x="550" y="106" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">📷  Image Upload</text>
  <text x="550" y="122" text-anchor="middle" fill="#bfdbfe" font-size="10">Photo of condition</text>

  <rect x="660" y="80" width="180" height="64" rx="10" fill="url(#blue)" filter="url(#sh)"/>
  <text x="750" y="106" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">🥽  AR Camera</text>
  <text x="750" y="122" text-anchor="middle" fill="#bfdbfe" font-size="10">Meta Quest 3 live feed</text>

  <!-- Row label -->
  <rect x="10" y="80" width="20" height="64" rx="4" fill="#3b82f6" opacity="0.5"/>
  <text x="20" y="118" text-anchor="middle" fill="#fff" font-size="7" font-weight="700" transform="rotate(-90,20,118)">INPUT</text>

  <!-- ===== ARROWS: Row 1 → Row 2 ===== -->
  <line x1="130" y1="144" x2="130" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="144" x2="330" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="144" x2="550" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="750" y1="144" x2="750" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== ROW 2: PROCESSING (y=200) ===== -->
  <rect x="40"  y="200" width="180" height="56" rx="10" fill="url(#slate)" stroke="#475569" stroke-width="1"/>
  <text x="130" y="224" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="500">Pass-through</text>
  <text x="130" y="240" text-anchor="middle" fill="#64748b" font-size="9">app.py</text>

  <rect x="240" y="200" width="180" height="56" rx="10" fill="url(#purple)" filter="url(#sh)"/>
  <text x="330" y="222" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Whisper Large v3</text>
  <text x="330" y="240" text-anchor="middle" fill="#c4b5fd" font-size="10">Speech → Text  ·  Groq API</text>

  <rect x="460" y="200" width="180" height="56" rx="10" fill="url(#purple)" filter="url(#sh)"/>
  <text x="550" y="222" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Llama 4 Scout</text>
  <text x="550" y="240" text-anchor="middle" fill="#c4b5fd" font-size="10">Image → Condition</text>

  <rect x="660" y="200" width="180" height="56" rx="10" fill="url(#purple)" filter="url(#sh)"/>
  <text x="750" y="222" text-anchor="middle" fill="#fff" font-size="12" font-weight="600">Llama 4 Scout</text>
  <text x="750" y="240" text-anchor="middle" fill="#c4b5fd" font-size="10">Frame → Condition</text>

  <!-- Row label -->
  <rect x="10" y="200" width="20" height="56" rx="4" fill="#8b5cf6" opacity="0.5"/>
  <text x="20" y="234" text-anchor="middle" fill="#fff" font-size="6" font-weight="700" transform="rotate(-90,20,234)">PROCESS</text>

  <!-- ===== ARROWS: Row 2 → Merge (all converge to center x=440, y=300) ===== -->
  <!-- Each box drops straight down, then turns horizontal to center -->
  <polyline points="130,256 130,280 440,280" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
  <polyline points="330,256 330,280 440,280" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
  <polyline points="550,256 550,280 440,280" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
  <polyline points="750,256 750,280 440,280" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Single line down from merge point -->
  <line x1="440" y1="280" x2="440" y2="300" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== ROW 3: ENRICHED QUERY (y=310) ===== -->
  <rect x="240" y="310" width="400" height="48" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" filter="url(#sh)"/>
  <text x="440" y="332" text-anchor="middle" fill="#fbbf24" font-size="12" font-weight="600">🔗  Enriched Query Builder</text>
  <text x="440" y="348" text-anchor="middle" fill="#94a3b8" font-size="10">Merges text + visual context into search queries</text>

  <!-- Arrow down -->
  <line x1="440" y1="358" x2="440" y2="388" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ===== ROW 4: RAG SEARCH (y=398) ===== -->
  <rect x="140" y="398" width="600" height="70" rx="12" fill="url(#green)" filter="url(#sh)"/>
  <text x="440" y="422" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">🔍  Multi-Query Fusion RAG Search</text>
  <text x="440" y="440" text-anchor="middle" fill="#a7f3d0" font-size="11">Embed query → Compare against 319 procedure vectors → Rank by similarity</text>
  <text x="440" y="456" text-anchor="middle" fill="#6ee7b7" font-size="9">database/retriever.py  ·  all-MiniLM-L6-v2  ·  319 procedures from 784 videos</text>

  <!-- Row label -->
  <rect x="10" y="398" width="20" height="70" rx="4" fill="#10b981" opacity="0.5"/>
  <text x="20" y="440" text-anchor="middle" fill="#fff" font-size="7" font-weight="700" transform="rotate(-90,20,440)">SEARCH</text>

  <!-- Arrow down -->
  <line x1="440" y1="468" x2="440" y2="498" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="455" y="486" fill="#64748b" font-size="9" font-style="italic">Top 5 procedures</text>

  <!-- ===== ROW 5: AI GENERATION (y=508) ===== -->
  <rect x="140" y="508" width="600" height="64" rx="12" fill="url(#amber)" filter="url(#sh)"/>
  <text x="440" y="532" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">🤖  Llama 3.3 70B — Answer Generation</text>
  <text x="440" y="548" text-anchor="middle" fill="#fef3c7" font-size="11">Procedures as context → Medical-expert prompt → Step-by-step guidance</text>
  <text x="440" y="562" text-anchor="middle" fill="#fde68a" font-size="9">models/generator.py  ·  models/llm.py  ·  via Groq API</text>

  <!-- Row label -->
  <rect x="10" y="508" width="20" height="64" rx="4" fill="#f59e0b" opacity="0.5"/>
  <text x="20" y="546" text-anchor="middle" fill="#fff" font-size="6" font-weight="700" transform="rotate(-90,20,546)">GENERATE</text>

  <!-- ===== ARROWS: Row 5 → Outputs (fan out from center to 3 boxes) ===== -->
  <line x1="440" y1="572" x2="440" y2="598" stroke="#475569" stroke-width="1.5"/>
  <polyline points="440,598 170,598 170,610" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <line x1="440" y1="598" x2="440" y2="610" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <polyline points="440,598 710,598 710,610" fill="none" stroke="#475569" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arrow)"/>

  <!-- ===== ROW 6: OUTPUTS (y=620) ===== -->
  <rect x="50"  y="620" width="240" height="56" rx="10" fill="url(#teal)" filter="url(#sh)"/>
  <text x="170" y="644" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">📝  AI Guidance</text>
  <text x="170" y="660" text-anchor="middle" fill="#99f6e4" font-size="10">Calm, step-by-step instructions</text>

  <rect x="320" y="620" width="240" height="56" rx="10" fill="url(#teal)" filter="url(#sh)"/>
  <text x="440" y="644" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">🎬  YouTube Video</text>
  <text x="440" y="660" text-anchor="middle" fill="#99f6e4" font-size="10">Jumps to exact timestamp</text>

  <rect x="590" y="620" width="240" height="56" rx="10" fill="url(#teal)" filter="url(#sh)"/>
  <text x="710" y="644" text-anchor="middle" fill="#fff" font-size="13" font-weight="600">🔊  Audio Playback</text>
  <text x="710" y="660" text-anchor="middle" fill="#99f6e4" font-size="10">Text-to-Speech output</text>

  <!-- Row label -->
  <rect x="10" y="620" width="20" height="56" rx="4" fill="#14b8a6" opacity="0.5"/>
  <text x="20" y="654" text-anchor="middle" fill="#fff" font-size="7" font-weight="700" transform="rotate(-90,20,654)">OUTPUT</text>

  <!-- Footer -->
  <text x="440" y="695" text-anchor="middle" fill="#475569" font-size="10">Arizona State University  ·  CSE 492 Thesis  ·  Spring 2026</text>
</svg>